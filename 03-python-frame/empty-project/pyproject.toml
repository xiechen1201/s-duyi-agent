[project]
name = "duyi-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
  "debugpy>=1.8.22",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/"]

# 下面的配置交给 pytest 使用
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
markers = ["smoke: 标记为冒烟测试，验证核心流程是否正常"]
